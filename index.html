<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHAOS REALM: Void Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  overflow:hidden;
  font-family:'Courier New',monospace;
  color:#fff;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
canvas{display:block;cursor:crosshair}

#ui{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:10;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:15px;
}
.top-bar{
  display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:8px;
}
.stat{
  background:rgba(0,0,0,.7);
  border:1px solid rgba(0,255,255,.3);
  padding:8px 14px;
  border-radius:8px;
  font-size:15px;font-weight:bold;
  letter-spacing:1px;
}
.stat span{color:#0ff}
.stat.hp span{color:#f55}
.stat.wave span{color:#f0f}

/* HP бар */
.hp-bar{
  width:200px;height:14px;
  background:rgba(0,0,0,.7);
  border:1px solid #f55;
  border-radius:7px;
  overflow:hidden;
  margin-top:4px;
}
.hp-fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#f00,#ff0);
  transition:width .2s;
}

/* Меню */
.menu{
  position:absolute;inset:0;
  z-index:100;
  background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:20px;
  pointer-events:auto;
  visibility:visible;opacity:1;
  transition:opacity .25s;
}
.hidden{
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}
h1{
  font-size:min(13vw,70px);
  letter-spacing:5px;
  color:#0ff;
  text-shadow:0 0 20px #0ff,3px 3px 0 #f0f;
  animation:glitch 2s infinite;
  margin-bottom:10px;
}
@keyframes glitch{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-2px,2px)}
  40%{transform:translate(2px,-2px)}
  60%{transform:translate(-2px,-2px)}
  80%{transform:translate(2px,2px)}
}
p{color:#aaa;font-size:16px;line-height:1.6;margin-bottom:25px;max-width:500px}
.btn{
  padding:15px 45px;
  font-size:20px;font-weight:bold;
  font-family:'Courier New',monospace;
  background:transparent;
  border:2px solid #0ff;
  color:#0ff;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:2px;
  transition:.2s;
  outline:none;
}
.btn:hover{background:#0ff;color:#000;box-shadow:0 0 30px #0ff}
.final-score{font-size:36px;color:#f0f;margin:15px 0;text-shadow:0 0 15px #f0f}
.hint{margin-top:20px;font-size:13px;color:#555}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="top-bar">
    <div class="stat wave">ВОЛНА: <span id="waveVal">1</span></div>
    <div class="stat">СЧЁТ: <span id="scoreVal">0</span></div>
    <div class="stat">☠ УБИТО: <span id="killsVal">0</span></div>
    <div class="stat hp">HP: <span id="hpVal">100</span>
      <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
    </div>
  </div>
</div>

<!-- СТАРТ -->
<div id="startMenu" class="menu">
  <h1>VOID<br>SHOOTER</h1>
  <p>
    Реальность заражена вирусом.<br>
    Уничтожь всех глитч-существ.<br>
    Они телепортируются. Ты должен быть быстрее.<br><br>
    🎯 WASD — движение | Мышь — прицел | ЛКМ — огонь | Пробел — рывок
  </p>
  <button class="btn" id="btnStart">ВОЙТИ В ПУСТОТУ ▶</button>
  <div class="hint">Каждая 5-я волна — БОСС</div>
</div>

<!-- GAME OVER -->
<div id="overMenu" class="menu hidden">
  <h1 style="color:#f00;text-shadow:0 0 20px #f00">СИСТЕМА<br>УНИЧТОЖЕНА</h1>
  <div class="final-score" id="finalScore">0</div>
  <p id="finalStats"></p>
  <button class="btn" id="btnRestart">ПЕРЕЗАГРУЗКА ↺</button>
</div>

<script>
// ============================================================
// AUDIO ENGINE (Industrial/Glitch)
// ============================================================
let audioCtx=null;
function initAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function tone(freq,type,dur,vol,delay=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+dur+0.05);
}

function noiseBuf(dur,vol,freq){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const bs=audioCtx.sampleRate*dur;
  const buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,2);
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=audioCtx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  src.start();
}

const SFX={
  shoot(){tone(600,'square',0.08,0.06);noiseBuf(0.05,0.04,2000)},
  enemyShoot(){tone(300,'sawtooth',0.1,0.05)},
  hit(){tone(200,'square',0.1,0.1);noiseBuf(0.08,0.08,800)},
  explode(){noiseBuf(0.3,0.2,600);tone(80,'sine',0.3,0.15)},
  teleport(){tone(1200,'sine',0.1,0.06);tone(1800,'sine',0.1,0.04,0.05)},
  playerHurt(){tone(150,'sawtooth',0.2,0.12);noiseBuf(0.15,0.1,400)},
  dash(){tone(400,'square',0.1,0.08);tone(800,'square',0.1,0.06,0.05)},
  wave(){[440,550,660].forEach((f,i)=>tone(f,'triangle',0.2,0.08,i*0.1))},
  boss(){tone(60,'sine',1,0.2);tone(80,'sine',1,0.15,0.1);noiseBuf(0.5,0.1,200)},
  collect(){tone(1000,'sine',0.08,0.07);tone(1500,'sine',0.1,0.05,0.05)},
  death(){tone(200,'sawtooth',0.5,0.2);noiseBuf(0.5,0.25,300);tone(50,'sine',0.8,0.2,0.2)}
};

// ============================================================
// CANVAS
// ============================================================
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const PI2=Math.PI*2;
let W,H;

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W;
  canvas.height=H;
  // Пересчёт позиции игрока при ресайзе
  if(player){
    player.x=Math.max(20,Math.min(W-20,player.x));
    player.y=Math.max(20,Math.min(H-20,player.y));
  }
}
window.addEventListener('resize',resize);

// ============================================================
// DOM
// ============================================================
const waveVal=document.getElementById('waveVal');
const scoreVal=document.getElementById('scoreVal');
const killsVal=document.getElementById('killsVal');
const hpVal=document.getElementById('hpVal');
const hpFill=document.getElementById('hpFill');
const startMenu=document.getElementById('startMenu');
const overMenu=document.getElementById('overMenu');
const btnStart=document.getElementById('btnStart');
const btnRestart=document.getElementById('btnRestart');
const finalScore=document.getElementById('finalScore');
const finalStats=document.getElementById('finalStats');

// ============================================================
// GAME STATE
// ============================================================
const game={
  playing:false,
  rafId:null,
  lastTime:0,
  frame:0,
  score:0,
  kills:0,
  wave:1,
  waveActive:false,
  wavePause:0,
  shake:0,
  enemies:[],
  bullets:[],
  enemyBullets:[],
  walls:[],
  particles:[],
  fragments:[],
  mouse:{x:0,y:0}
};

// ============================================================
// PLAYER
// ============================================================
let player=null;
const keys={};

class Player{
  constructor(){
    this.x=W/2;
    this.y=H/2;
    this.r=14;
    this.speed=4;
    this.hp=100;
    this.maxHp=100;
    this.shootCD=0;
    this.dashCD=0;
    this.dashTimer=0;
    this.invincible=0;
    this.angle=0;
  }

  update(dt){
    // Угол к мыши
    this.angle=Math.atan2(game.mouse.y-this.y,game.mouse.x-this.x);

    // Рывок
    if(this.dashTimer>0){
      this.dashTimer-=dt;
      const dashSpeed=14;
      this.x+=Math.cos(this.angle)*dashSpeed*dt*60;
      this.y+=Math.sin(this.angle)*dashSpeed*dt*60;
    }else{
      // Обычное движение
      let mx=0,my=0;
      if(keys.KeyW||keys.ArrowUp)my-=1;
      if(keys.KeyS||keys.ArrowDown)my+=1;
      if(keys.KeyA||keys.ArrowLeft)mx-=1;
      if(keys.KeyD||keys.ArrowRight)mx+=1;

      if(mx!==0||my!==0){
        const mag=Math.hypot(mx,my);
        this.x+=(mx/mag)*this.speed*dt*60;
        this.y+=(my/mag)*this.speed*dt*60;
      }
    }

    // Границы экрана
    this.x=Math.max(this.r,Math.min(W-this.r,this.x));
    this.y=Math.max(this.r,Math.min(H-this.r,this.y));

    // Кулдауны
    if(this.shootCD>0)this.shootCD-=dt*60;
    if(this.dashCD>0)this.dashCD-=dt*60;
    if(this.invincible>0)this.invincible-=dt*60;

    // Стрельба
    if(mouseDown&&this.shootCD<=0){
      this.shoot();
      this.shootCD=10;
    }
  }

  shoot(){
    const bx=this.x+Math.cos(this.angle)*20;
    const by=this.y+Math.sin(this.angle)*20;
    game.bullets.push({
      x:bx,y:by,
      vx:Math.cos(this.angle)*10,
      vy:Math.sin(this.angle)*10,
      r:4,
      life:80
    });
    SFX.shoot();
    // Отдача
    this.x-=Math.cos(this.angle)*2;
    this.y-=Math.sin(this.angle)*2;
  }

  dash(){
    if(this.dashCD<=0&&this.dashTimer<=0){
      this.dashTimer=0.15;
      this.dashCD=60; // 1 секунда кулдаун
      this.invincible=10; // Краткая неуязвимость
      SFX.dash();
      addBurst(this.x,this.y,'#0ff',8);
    }
  }

  takeDamage(dmg){
    if(this.invincible>0)return;
    this.hp-=dmg;
    this.invincible=30; // 0.5 сек неуязвимости после урона
    game.shake=8;
    SFX.playerHurt();
    addBurst(this.x,this.y,'#f55',10);
    updateHUD();
    if(this.hp<=0){
      this.hp=0;
      endGame();
    }
  }

  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);

    // Мигание при неуязвимости
    if(this.invincible>0&&Math.floor(this.invincible/3)%2===0){
      ctx.globalAlpha=0.4;
    }

    // Свечение
    ctx.shadowBlur=20;
    ctx.shadowColor='#0ff';

    // Тело
    ctx.fillStyle='#0ff';
    ctx.beginPath();
    ctx.arc(0,0,this.r,0,PI2);
    ctx.fill();

    // Внутренний круг
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(0,0,this.r*0.6,0,PI2);
    ctx.fill();

    // "Глаз" — направление
    ctx.fillStyle='#0ff';
    ctx.beginPath();
    ctx.arc(Math.cos(this.angle)*6,Math.sin(this.angle)*6,4,0,PI2);
    ctx.fill();

    ctx.shadowBlur=0;

    // Линия прицела
    ctx.strokeStyle='rgba(0,255,255,.3)';
    ctx.lineWidth=1;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(Math.cos(this.angle)*20,Math.sin(this.angle)*20);
    ctx.lineTo(Math.cos(this.angle)*60,Math.sin(this.angle)*60);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }
}

// ============================================================
// ENEMIES
// ============================================================
class Enemy{
  constructor(type,x,y,wave){
    this.type=type;
    this.x=x;
    this.y=y;
    this.angle=0;
    this.dead=false;
    this.flash=0;

    if(type==='drone'){
      this.r=16;
      this.hp=20+wave*3;
      this.maxHp=this.hp;
      this.shootCD=90;
      this.teleportCD=120+Math.random()*60;
      this.color='#f0f';
      this.score=100;
    }else if(type==='virus'){
      this.r=14;
      this.hp=30+wave*4;
      this.maxHp=this.hp;
      this.speed=1.5+wave*0.1;
      this.color='#f55';
      this.score=150;
    }else if(type==='phantom'){
      this.r=18;
      this.hp=15+wave*2;
      this.maxHp=this.hp;
      this.speed=2+wave*0.15;
      this.visible=false;
      this.color='#88f';
      this.score=200;
    }else if(type==='boss'){
      this.r=40;
      this.hp=300+wave*50;
      this.maxHp=this.hp;
      this.shootCD=40;
      this.teleportCD=80;
      this.speed=1;
      this.color='#ff0';
      this.score=1000;
    }
  }

  update(dt){
    if(this.flash>0)this.flash-=dt*60;

    const dx=player.x-this.x;
    const dy=player.y-this.y;
    const dist=Math.hypot(dx,dy);
    this.angle=Math.atan2(dy,dx);

    if(this.type==='drone'){
      // Телепорт
      this.teleportCD-=dt*60;
      if(this.teleportCD<=0){
        this.teleport();
        this.teleportCD=120+Math.random()*60;
      }
      // Стрельба
      this.shootCD-=dt*60;
      if(this.shootCD<=0&&dist<400){
        this.shootAt(dx,dy,dist);
        this.shootCD=90;
      }
    }
    else if(this.type==='virus'){
      // Преследование
      if(dist>0){
        this.x+=(dx/dist)*this.speed*dt*60;
        this.y+=(dy/dist)*this.speed*dt*60;
      }
      // Взрыв при контакте
      if(dist<this.r+player.r){
        player.takeDamage(20);
        this.explode();
      }
    }
    else if(this.type==='phantom'){
      // Видимость только вблизи
      this.visible=dist<200;
      if(this.visible&&dist>0){
        this.x+=(dx/dist)*this.speed*dt*60;
        this.y+=(dy/dist)*this.speed*dt*60;
      }
      // Урон при контакте
      if(dist<this.r+player.r){
        player.takeDamage(15);
        this.explode();
      }
    }
    else if(this.type==='boss'){
      // Медленное преследование
      if(dist>0){
        this.x+=(dx/dist)*this.speed*dt*60;
        this.y+=(dy/dist)*this.speed*dt*60;
      }
      // Телепорт
      this.teleportCD-=dt*60;
      if(this.teleportCD<=0){
        this.teleport();
        this.teleportCD=80;
      }
      // Стрельба очередью (3 пули веером)
      this.shootCD-=dt*60;
      if(this.shootCD<=0){
        for(let i=-1;i<=1;i++){
          const a=this.angle+i*0.3;
          game.enemyBullets.push({
            x:this.x,y:this.y,
            vx:Math.cos(a)*5,
            vy:Math.sin(a)*5,
            r:5,life:120,
            color:'#ff0'
          });
        }
        SFX.enemyShoot();
        this.shootCD=40;
      }
      // Урон при контакте
      if(dist<this.r+player.r){
        player.takeDamage(30);
      }
    }
  }

  teleport(){
    // Исчезает в одном месте, появляется в другом
    addBurst(this.x,this.y,this.color,8);
    SFX.teleport();

    // Новая позиция подальше от игрока
    let nx,ny,attempts=0;
    do{
      nx=40+Math.random()*(W-80);
      ny=40+Math.random()*(H-80);
      attempts++;
    }while(Math.hypot(nx-player.x,ny-player.y)<150&&attempts<20);

    this.x=nx;
    this.y=ny;
    addBurst(this.x,this.y,this.color,8);
  }

  shootAt(dx,dy,dist){
    if(dist===0)return;
    game.enemyBullets.push({
      x:this.x,y:this.y,
      vx:(dx/dist)*4,
      vy:(dy/dist)*4,
      r:4,life:150,
      color:this.color
    });
    SFX.enemyShoot();
  }

  explode(){
    this.dead=true;
    addBurst(this.x,this.y,this.color,15);
    SFX.explode();
    game.shake=5;
  }

  takeDamage(dmg){
    this.hp-=dmg;
    this.flash=6;
    if(this.hp<=0){
      this.dead=true;
      game.kills++;
      game.score+=this.score;
      addBurst(this.x,this.y,this.color,20);
      SFX.explode();
      game.shake=4;

      // Шанс выпадения фрагмента
      if(Math.random()<0.3){
        game.fragments.push({
          x:this.x,y:this.y,
          r:8,angle:0,life:300
        });
      }

      updateHUD();
    }
  }

  draw(){
    if(this.type==='phantom'&&!this.visible)return;

    ctx.save();
    ctx.translate(this.x,this.y);

    // Эффект глитча (смещение при отрисовке)
    if(Math.random()<0.1){
      ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
    }

    const color=this.flash>0?'#fff':this.color;

    ctx.shadowBlur=15;
    ctx.shadowColor=color;

    if(this.type==='drone'){
      // Ромб
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(0,-this.r);
      ctx.lineTo(this.r,0);
      ctx.lineTo(0,this.r);
      ctx.lineTo(-this.r,0);
      ctx.closePath();
      ctx.fill();
    }
    else if(this.type==='virus'){
      // Шипастый круг
      ctx.fillStyle=color;
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=(i/8)*PI2;
        const r1=this.r;
        const r2=this.r*0.6;
        ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);
        ctx.lineTo(Math.cos(a+PI2/16)*r2,Math.sin(a+PI2/16)*r2);
      }
      ctx.closePath();
      ctx.fill();
    }
    else if(this.type==='phantom'){
      // Полупрозрачный круг
      ctx.globalAlpha=0.6;
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.arc(0,0,this.r,0,PI2);
      ctx.fill();
      ctx.globalAlpha=1;
      // Глаза
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(-5,-3,3,0,PI2);
      ctx.arc(5,-3,3,0,PI2);
      ctx.fill();
    }
    else if(this.type==='boss'){
      // Большой шестиугольник
      ctx.fillStyle=color;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=(i/6)*PI2;
        ctx.lineTo(Math.cos(a)*this.r,Math.sin(a)*this.r);
      }
      ctx.closePath();
      ctx.fill();
      // Внутренний круг
      ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.arc(0,0,this.r*0.5,0,PI2);
      ctx.fill();
      // Глаз
      ctx.fillStyle='#f00';
      ctx.beginPath();
      ctx.arc(Math.cos(this.angle)*10,Math.sin(this.angle)*10,8,0,PI2);
      ctx.fill();
    }

    ctx.shadowBlur=0;

    // HP бар (кроме босса — у него свой сверху)
    if(this.type!=='boss'&&this.hp<this.maxHp){
      const bw=this.r*2;
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.fillRect(-bw/2,-this.r-10,bw,4);
      ctx.fillStyle='#0f0';
      ctx.fillRect(-bw/2,-this.r-10,bw*(this.hp/this.maxHp),4);
    }

    ctx.restore();
  }
}

// ============================================================
// WALLS (Стены данных)
// ============================================================
class DataWall{
  constructor(){
    // Случайная стена
    this.horizontal=Math.random()<0.5;
    if(this.horizontal){
      this.w=100+Math.random()*150;
      this.h=15;
    }else{
      this.w=15;
      this.h=100+Math.random()*150;
    }
    this.x=50+Math.random()*(W-100-this.w);
    this.y=50+Math.random()*(H-100-this.h);
    this.life=300+Math.random()*180; // 5-8 секунд
    this.maxLife=this.life;
  }

  update(dt){
    this.life-=dt*60;
  }

  draw(){
    const alpha=Math.min(1,this.life/30); // Затухание
    ctx.save();
    ctx.globalAlpha=alpha*0.8;
    ctx.fillStyle='#f0f';
    ctx.shadowBlur=10;
    ctx.shadowColor='#f0f';
    ctx.fillRect(this.x,this.y,this.w,this.h);

    // Текст ошибки на стене
    ctx.fillStyle='#fff';
    ctx.font='10px Courier New';
    ctx.fillText('0x'+Math.floor(this.x).toString(16),this.x+5,this.y+this.h/2+3);
    ctx.restore();
  }
}

// ============================================================
// EFFECTS
// ============================================================
function addBurst(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*PI2;
    const s=2+Math.random()*4;
    game.particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:1,
      size:2+Math.random()*3,
      color
    });
  }
}

function addFloat(x,y,text,color,size=16){
  game.particles.push({
    x,y,text,color,size,
    vx:0,vy:-1,
    life:1,
    isText:true
  });
}

// ============================================================
// WAVE SYSTEM
// ============================================================
function startWave(n){
  game.wave=n;
  game.waveActive=true;

  const isBossWave=n%5===0;

  if(isBossWave){
    // Босс + пара дронов
    game.enemies.push(new Enemy('boss',W/2,100,n));
    game.enemies.push(new Enemy('drone',100,100,n));
    game.enemies.push(new Enemy('drone',W-100,100,n));
    SFX.boss();
    addFloat(W/2,H/2,'⚠ БОСС ⚠','#ff0',30);
  }else{
    const droneCount=Math.min(2+Math.floor(n/2),6);
    const virusCount=Math.min(Math.floor(n/2),5);
    const phantomCount=Math.min(Math.floor((n-1)/3),4);

    for(let i=0;i<droneCount;i++){
      game.enemies.push(new Enemy('drone',
        60+Math.random()*(W-120),
        60+Math.random()*(H-120),n));
    }
    for(let i=0;i<virusCount;i++){
      game.enemies.push(new Enemy('virus',
        60+Math.random()*(W-120),
        60+Math.random()*(H-120),n));
    }
    for(let i=0;i<phantomCount;i++){
      game.enemies.push(new Enemy('phantom',
        60+Math.random()*(W-120),
        60+Math.random()*(H-120),n));
    }
    SFX.wave();
  }

  // Стены данных
  const wallCount=Math.min(1+Math.floor(n/3),4);
  for(let i=0;i<wallCount;i++){
    game.walls.push(new DataWall());
  }

  updateHUD();
}

function checkWaveComplete(){
  if(game.waveActive&&game.enemies.length===0){
    game.waveActive=false;
    game.wavePause=180; // 3 секунды паузы
    const bonus=game.wave*50;
    game.score+=bonus;
    addFloat(W/2,H/2,'ВОЛНА '+game.wave+' ЗАЧИЩЕНА! +'+bonus,'#0f0',24);
    updateHUD();
  }
}

// ============================================================
// UPDATE
// ============================================================
function update(dt){
  if(!game.playing)return;
  game.frame++;

  // Пауза между волнами
  if(!game.waveActive){
    if(game.wavePause>0){
      game.wavePause-=dt*60;
    }else{
      startWave(game.wave+1);
    }
  }

  // Игрок
  player.update(dt);

  // Враги
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    e.update(dt);
    if(e.dead){
      game.enemies.splice(i,1);
    }
  }

  // Пули игрока
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    b.x+=b.vx*dt*60;
    b.y+=b.vy*dt*60;
    b.life--;

    let removed=false;

    // Столкновение с врагами
    for(const e of game.enemies){
      if(e.type==='phantom'&&!e.visible)continue; // Нельзя стрелять в невидимых
      const dist=Math.hypot(b.x-e.x,b.y-e.y);
      if(dist<b.r+e.r){
        e.takeDamage(10);
        addBurst(b.x,b.y,'#0ff',5);
        SFX.hit();
        game.bullets.splice(i,1);
        removed=true;
        break;
      }
    }

    if(removed)continue;

    // Столкновение со стенами
    for(const w of game.walls){
      if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){
        addBurst(b.x,b.y,'#f0f',3);
        game.bullets.splice(i,1);
        removed=true;
        break;
      }
    }

    if(removed)continue;

    // Выход за экран
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){
      game.bullets.splice(i,1);
    }
  }

  // Пули врагов
  for(let i=game.enemyBullets.length-1;i>=0;i--){
    const b=game.enemyBullets[i];
    b.x+=b.vx*dt*60;
    b.y+=b.vy*dt*60;
    b.life--;

    // Столкновение с игроком
    const dist=Math.hypot(b.x-player.x,b.y-player.y);
    if(dist<b.r+player.r){
      player.takeDamage(10);
      game.enemyBullets.splice(i,1);
      continue;
    }

    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){
      game.enemyBullets.splice(i,1);
    }
  }

  // Стены
  for(let i=game.walls.length-1;i>=0;i--){
    const w=game.walls[i];
    w.update(dt);

    // Столкновение с игроком (отталкивание)
    if(player.x+player.r>w.x&&player.x-player.r<w.x+w.w&&
       player.y+player.r>w.y&&player.y-player.r<w.y+w.h){
      // Выталкиваем игрока из стены
      const cx=w.x+w.w/2;
      const cy=w.y+w.h/2;
      const dx=player.x-cx;
      const dy=player.y-cy;
      const dist=Math.hypot(dx,dy)||1;
      player.x+=dx/dist*3;
      player.y+=dy/dist*3;
    }

    if(w.life<=0){
      game.walls.splice(i,1);
    }
  }

  // Фрагменты
  for(let i=game.fragments.length-1;i>=0;i--){
    const f=game.fragments[i];
    f.angle+=0.05;
    f.life--;

    const dist=Math.hypot(f.x-player.x,f.y-player.y);
    if(dist<f.r+player.r){
      game.score+=50;
      SFX.collect();
      addFloat(f.x,f.y,'+50','#ffd700',16);
      addBurst(f.x,f.y,'#ffd700',6);
      game.fragments.splice(i,1);
      updateHUD();
      continue;
    }

    if(f.life<=0){
      game.fragments.splice(i,1);
    }
  }

  // Частицы
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.x+=p.vx*dt*60;
    p.y+=p.vy*dt*60;
    p.life-=dt*1.5;
    if(p.life<=0)game.particles.splice(i,1);
  }

  checkWaveComplete();

  // Тряска затухает
  if(game.shake>0){
    game.shake*=0.9;
    if(game.shake<0.5)game.shake=0;
  }
}

// ============================================================
// DRAW
// ============================================================
function draw(){
  // Фон
  ctx.fillStyle='#050505';
  ctx.fillRect(0,0,W,H);

  ctx.save();

  // Тряска экрана
  if(game.shake>0){
    ctx.translate(
      (Math.random()-0.5)*game.shake,
      (Math.random()-0.5)*game.shake
    );
  }

  // Сетка фона
  ctx.strokeStyle='rgba(255,0,255,.04)';
  ctx.lineWidth=1;
  const gridSize=60;
  for(let x=0;x<W;x+=gridSize){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<H;y+=gridSize){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // Стены
  game.walls.forEach(w=>w.draw());

  // Фрагменты
  game.fragments.forEach(f=>{
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.angle);
    ctx.fillStyle='#ffd700';
    ctx.shadowBlur=10;
    ctx.shadowColor='#ffd700';
    ctx.beginPath();
    ctx.moveTo(0,-f.r);
    ctx.lineTo(f.r,0);
    ctx.lineTo(0,f.r);
    ctx.lineTo(-f.r,0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Пули игрока
  ctx.fillStyle='#0ff';
  ctx.shadowBlur=8;
  ctx.shadowColor='#0ff';
  game.bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,PI2);
    ctx.fill();
  });
  ctx.shadowBlur=0;

  // Пули врагов
  game.enemyBullets.forEach(b=>{
    ctx.fillStyle=b.color||'#f0f';
    ctx.shadowBlur=8;
    ctx.shadowColor=b.color||'#f0f';
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,PI2);
    ctx.fill();
  });
  ctx.shadowBlur=0;

  // Враги
  game.enemies.forEach(e=>e.draw());

  // Игрок
  if(player)player.draw();

  // Частицы
  game.particles.forEach(p=>{
    if(p.isText){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.font='bold '+p.size+'px Courier New';
      ctx.textAlign='center';
      ctx.fillText(p.text,p.x,p.y);
      ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x,p.y,p.size,p.size);
      ctx.globalAlpha=1;
    }
  });

  ctx.restore();

  // === ПОСТ-ЭФФЕКТЫ ===

  // Сканлайны
  ctx.fillStyle='rgba(0,0,0,.08)';
  for(let y=0;y<H;y+=4){
    ctx.fillRect(0,y,W,1);
  }

  // Случайный глитч-блок
  if(Math.random()<0.02){
    const gh=Math.random()*30+5;
    const gy=Math.random()*H;
    ctx.fillStyle=`rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},.3)`;
    ctx.fillRect(Math.random()*W,gy,Math.random()*200,gh);
  }

  // Виньетка
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);

  // HP бар босса сверху
  const boss=game.enemies.find(e=>e.type==='boss');
  if(boss){
    const bw=W*0.5;
    const bx=(W-bw)/2;
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(bx,10,bw,20);
    ctx.strokeStyle='#ff0';
    ctx.lineWidth=2;
    ctx.strokeRect(bx,10,bw,20);
    ctx.fillStyle='#ff0';
    ctx.fillRect(bx+2,12,(bw-4)*(boss.hp/boss.maxHp),16);
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Courier New';
    ctx.textAlign='center';
    ctx.fillText('⚠ GLITCH BOSS ⚠',W/2,24);
  }
}

// ============================================================
// HUD
// ============================================================
function updateHUD(){
  waveVal.textContent=game.wave;
  scoreVal.textContent=game.score;
  killsVal.textContent=game.kills;
  hpVal.textContent=Math.max(0,Math.ceil(player.hp));
  hpFill.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
}

// ============================================================
// GAME FLOW
// ============================================================
function startGame(){
  initAudio();
  btnStart.blur();
  btnRestart.blur();

  startMenu.classList.add('hidden');
  overMenu.classList.add('hidden');

  game.playing=true;
  game.frame=0;
  game.score=0;
  game.kills=0;
  game.wave=0;
  game.waveActive=false;
  game.wavePause=60; // 1 сек до первой волны
  game.shake=0;
  game.enemies=[];
  game.bullets=[];
  game.enemyBullets=[];
  game.walls=[];
  game.particles=[];
  game.fragments=[];

  resize();
  player=new Player();
  updateHUD();

  if(game.rafId)cancelAnimationFrame(game.rafId);
  game.lastTime=performance.now();
  game.rafId=requestAnimationFrame(loop);
}

function endGame(){
  game.playing=false;
  SFX.death();
  game.shake=20;

  finalScore.textContent=game.score;
  finalStats.textContent='Волна: '+game.wave+' | Убито: '+game.kills;

  setTimeout(()=>{
    overMenu.classList.remove('hidden');
  },600);
}

function loop(now){
  if(!game.playing){
    // Финальный кадр с тряской при смерти
    draw();
    if(game.shake>0){
      game.shake*=0.9;
      game.rafId=requestAnimationFrame(loop);
    }
    return;
  }

  let dt=(now-game.lastTime)/1000;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>0.05)dt=0.05;
  game.lastTime=now;

  update(dt);
  draw();

  game.rafId=requestAnimationFrame(loop);
}

// ============================================================
// INPUT
// ============================================================
let mouseDown=false;

window.addEventListener('mousemove',e=>{
  game.mouse.x=e.clientX;
  game.mouse.y=e.clientY;
});

window.addEventListener('mousedown',e=>{
  if(e.button===0)mouseDown=true;
});

window.addEventListener('mouseup',e=>{
  if(e.button===0)mouseDown=false;
});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(game.playing&&player)player.dash();
    return;
  }
  keys[e.code]=true;
});

window.addEventListener('keyup',e=>{
  keys[e.code]=false;
});

// Тач-управление (базовое)
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  game.mouse.x=t.clientX;
  game.mouse.y=t.clientY;
  mouseDown=true;
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  game.mouse.x=t.clientX;
  game.mouse.y=t.clientY;
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  mouseDown=false;
},{passive:false});

btnStart.addEventListener('click',startGame);
btnRestart.addEventListener('click',startGame);

// ============================================================
// INIT
// ============================================================
resize();
ctx.fillStyle='#050505';
ctx.fillRect(0,0,W,H);
</script>
